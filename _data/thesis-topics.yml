- title: Creating a lane graph from decimeter-level GNSS trajectory recordings
  description: "Creating a lane-level navigation graph automatically from recorded decimeter-level (RTK-GNSS) vehicle trajectories, so autonomous vehicles stay in the correct lane and minimize lane changes, and evaluating its quality with established lane-topology metrics."
  type: High-definition maps
