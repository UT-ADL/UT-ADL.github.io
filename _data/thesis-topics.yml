- title: Creating city-scale Gaussian splatting worlds
  description: "Building a pipeline for reconstructing and rendering a photorealistic Gaussian splatting world of Tartu that scales to the whole city — a BSc thesis can demonstrate the pipeline on a selected district, while an MSc thesis should aim for full city coverage."
  type: Validation & testing
