- title: Integrating Autoware Mini with the electric toy car platform
  description: "Adapting Autoware Mini, the lab's autonomous driving software stack, to run on the lab's small-scale test platform based on an electric children's car — finding or writing sensor drivers (lidar, GNSS, camera), connecting them to Autoware Mini and updating the control module, so the vehicle can navigate a small toy city in the Delta courtyard."
