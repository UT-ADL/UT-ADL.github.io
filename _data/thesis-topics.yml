- title: Collision detection in Gaussian splatting worlds
  description: "Investigating automatic ways to create colliders for Gaussian splats — distinguishing real obstacles from drive-through splats like tree branches and noise — and applying them to a Gaussian splatting world of Tartu for testing autonomous vehicles."
  type: Validation & testing
  availability:
