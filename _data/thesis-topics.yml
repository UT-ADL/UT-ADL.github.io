- title: Real-time GNSS-free map-based localisation on board an autonomous vehicle
  description: "Making the lab's offline map-based particle filter localisation pipelines (milestone boards on the highway scale, street-name signs on the city scale) run in real time on board the lab's Lexus RX450h, with on-road evaluation in shadow mode."
  type: Perception
