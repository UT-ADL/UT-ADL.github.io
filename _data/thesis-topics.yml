- title: Scenarios for certifying autonomous vehicles
  description: "Creating a taxonomy of scenarios a self-driving vehicle would need to pass to be certified for public streets under EU regulation — especially relevant for end-to-end machine learning stacks — and implementing a subset of these scenarios in simulation (e.g. CARLA ScenarioRunner)."
  type: Validation & testing
