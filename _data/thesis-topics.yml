- title: Localization of autonomous vehicle using triangulation based on city distances
  description: "GNSS-free localization of an autonomous vehicle by triangulating distances to nearby cities from roadside milestone boards, combining multilateration with vehicle odometry and evaluating on data from the lab's Lexus platform."
  type: Perception
