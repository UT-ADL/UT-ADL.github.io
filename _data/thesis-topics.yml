- title: Controlling a real car with general-purpose AI
  description: "Replicating the DrivingBench experiment on the lab's Lexus: setting up a cone course and testing which current frontier vision-language models can drive through it, with repeated independent trials per model and a safety protocol covering safety-driver procedures and model refusals."
