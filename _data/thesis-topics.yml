- title: World models for testing end-to-end driving models
  description: "Evaluating existing pre-trained world models and video generation networks for closed-loop testing of end-to-end driving networks, with special attention to rendering different sensors from custom locations and assessing what is feasible beyond cameras, e.g. for lidar."
