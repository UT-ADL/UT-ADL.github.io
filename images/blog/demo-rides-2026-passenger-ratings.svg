<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Passenger ratings on five questions, 13 responses each, plotted on a 1 to 5 scale with the mean marked">
<text x="0" y="20" font-size="15" font-weight="600" fill="#0b0b0b">How the ride felt from the back seat</text>
<text x="0" y="41" font-size="12.5" fill="#52514e">13 passengers rated each question from 1 to 5. Circle size shows how many gave that rating.</text>
<text x="0" y="60" font-size="12.5" fill="#52514e">The diamond marks the average.</text>
<line x1="250.0" y1="82" x2="250.0" y2="380" stroke="#e1e0d9" stroke-width="1"/>
<text x="250.0" y="74" font-size="11" fill="#898781" text-anchor="middle">1</text>
<line x1="338.0" y1="82" x2="338.0" y2="380" stroke="#e1e0d9" stroke-width="1"/>
<text x="338.0" y="74" font-size="11" fill="#898781" text-anchor="middle">2</text>
<line x1="426.0" y1="82" x2="426.0" y2="380" stroke="#e1e0d9" stroke-width="1"/>
<text x="426.0" y="74" font-size="11" fill="#898781" text-anchor="middle">3</text>
<line x1="514.0" y1="82" x2="514.0" y2="380" stroke="#e1e0d9" stroke-width="1"/>
<text x="514.0" y="74" font-size="11" fill="#898781" text-anchor="middle">4</text>
<line x1="602.0" y1="82" x2="602.0" y2="380" stroke="#e1e0d9" stroke-width="1"/>
<text x="602.0" y="74" font-size="11" fill="#898781" text-anchor="middle">5</text>
<text x="618" y="74" font-size="11" fill="#898781">average</text>
<text x="228" y="112" font-size="13" fill="#0b0b0b" text-anchor="end">Did you feel safe?</text>
<line x1="250.0" y1="108" x2="602.0" y2="108" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="426.0" cy="108" r="6.9" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="426.0" y="112" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">2</text>
<circle cx="514.0" cy="108" r="9.0" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.0" y="112" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">5</text>
<circle cx="602.0" cy="108" r="9.6" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="602.0" y="112" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">6</text>
<path d="M541.3,87 l5.5,5.5 l-5.5,5.5 l-5.5,-5.5 Z" fill="#009469"/>
<text x="618" y="112" font-size="13" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">4.3</text>
<text x="250.0" y="134" font-size="10.5" fill="#898781">1 = anxious throughout</text>
<text x="602.0" y="134" font-size="10.5" fill="#898781" text-anchor="end">5 = no anxiety at any point</text>
<text x="228" y="178" font-size="13" fill="#0b0b0b" text-anchor="end">Did it meet expectations?</text>
<line x1="250.0" y1="174" x2="602.0" y2="174" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="426.0" cy="174" r="9.0" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="426.0" y="178" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">5</text>
<circle cx="514.0" cy="174" r="9.0" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.0" y="178" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">5</text>
<circle cx="602.0" cy="174" r="7.7" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="602.0" y="178" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">3</text>
<path d="M500.8,153 l5.5,5.5 l-5.5,5.5 l-5.5,-5.5 Z" fill="#009469"/>
<text x="618" y="178" font-size="13" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">3.9</text>
<text x="250.0" y="200" font-size="10.5" fill="#898781">1 = fell short</text>
<text x="602.0" y="200" font-size="10.5" fill="#898781" text-anchor="end">5 = greatly exceeded them</text>
<text x="228" y="244" font-size="13" fill="#0b0b0b" text-anchor="end">Was the ride comfortable?</text>
<line x1="250.0" y1="240" x2="602.0" y2="240" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="338.0" cy="240" r="5.8" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="338.0" y="244" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">1</text>
<circle cx="426.0" cy="240" r="8.4" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="426.0" y="244" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">4</text>
<circle cx="514.0" cy="240" r="10.6" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.0" y="244" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">8</text>
<path d="M473.5,219 l5.5,5.5 l-5.5,5.5 l-5.5,-5.5 Z" fill="#009469"/>
<text x="618" y="244" font-size="13" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">3.5</text>
<text x="250.0" y="266" font-size="10.5" fill="#898781">1 = often jerky</text>
<text x="602.0" y="266" font-size="10.5" fill="#898781" text-anchor="end">5 = smooth throughout</text>
<text x="228" y="310" font-size="13" fill="#0b0b0b" text-anchor="end">Did the car seem capable?</text>
<line x1="250.0" y1="306" x2="602.0" y2="306" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="426.0" cy="306" r="10.1" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="426.0" y="310" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">7</text>
<circle cx="514.0" cy="306" r="9.0" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.0" y="310" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">5</text>
<circle cx="602.0" cy="306" r="5.8" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="602.0" y="310" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">1</text>
<path d="M473.5,285 l5.5,5.5 l-5.5,5.5 l-5.5,-5.5 Z" fill="#009469"/>
<text x="618" y="310" font-size="13" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">3.5</text>
<text x="250.0" y="332" font-size="10.5" fill="#898781">1 = lost in traffic</text>
<text x="602.0" y="332" font-size="10.5" fill="#898781" text-anchor="end">5 = fully confident, no help needed</text>
<text x="228" y="376" font-size="13" fill="#0b0b0b" text-anchor="end">How did it compare to a human?</text>
<line x1="250.0" y1="372" x2="602.0" y2="372" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="250.0" cy="372" r="7.7" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="250.0" y="376" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">3</text>
<circle cx="338.0" cy="372" r="10.1" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="338.0" y="376" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">7</text>
<circle cx="426.0" cy="372" r="5.8" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="426.0" y="376" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">1</text>
<circle cx="514.0" cy="372" r="6.9" fill="#c9def8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.0" y="376" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">2</text>
<path d="M351.2,351 l5.5,5.5 l-5.5,5.5 l-5.5,-5.5 Z" fill="#009469"/>
<text x="618" y="376" font-size="13" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">2.1</text>
<text x="250.0" y="398" font-size="10.5" fill="#898781">1 = much worse</text>
<text x="602.0" y="398" font-size="10.5" fill="#898781" text-anchor="end">5 = much better</text>
</svg>